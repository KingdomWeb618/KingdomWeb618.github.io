  "research": {
    "title": "Research",
    "intro": "Two recurring questions guide my work: what can be learned from imperfect measurements, and how can that information be turned into reliable algorithms?",
    "items": [
      {
        "label": "01 / DYNAMICAL SYSTEMS",
        "title": "Learning from quantized observations",
        "text": "Online estimation of system order and parameters from binary-valued, noisy measurements; recursive methods and consistency analysis.",
        "image": "/images/research/quantized-observations.png",
        "image_alt": "Conceptual illustration of continuous signals, binary measurements, and recursive inference."
      },
      {
        "label": "02 / INTELLIGENT PERCEPTION",
        "title": "Seeing weak signals in complex scenes",
        "text": "Infrared small moving-target detection under low SNR and dynamic backgrounds, using motion priors and sparse–low-rank models.",
        "image": "/images/research/weak-target-perception.png",
        "image_alt": "Conceptual illustration of a weak moving point separated from a sequence of cluttered sensor frames."
      },
      {
        "label": "03 / MATHEMATICAL METHODS",
        "title": "Connecting models and data",
        "text": "Structured statistical inference and optimization that combine prior knowledge with data-adaptive components for reliable intelligent systems.",
