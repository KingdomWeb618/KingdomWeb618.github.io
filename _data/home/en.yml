    "tagline": "Recovering reliable information from imperfect observations.",
    "paragraphs": [
      "I am a Ph.D. student in Operations Research and Cybernetics at the <a href=\"https://www.amss.ac.cn/\">Academy of Mathematics and Systems Science, Chinese Academy of Sciences</a>. I joined the M.S.–Ph.D. track in 2024 and entered the doctoral stage in 2026.",
      "My research connects <strong>statistical estimation</strong>, <strong>system identification</strong>, <strong>optimization</strong>, and <strong>intelligent perception</strong>. I am interested in methods that combine mathematical structure with data, with an emphasis on robustness, interpretability, and theoretical analysis.",
      "I received my B.S. in Mathematics and Applied Mathematics from Wuhan University in 2024."
    ],
    "contact_label": "Get in touch"
